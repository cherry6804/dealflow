name: DealFlow CI

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"
      - "fix/**"
      - "security/**"
      - "docs/**"
      - "refactor/**"
      - "spike/**"
      - "hotfix/**"
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

concurrency:
  group: dealflow-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-validation:
    name: Repository Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate repository structure
        shell: bash
        run: |
          set -euo pipefail

          required_paths=(
            ".github/workflows"
            "backend"
            "docs"
            "frontend"
            "infrastructure"
            "scripts"
            "tests"
          )

          for path in "${required_paths[@]}"; do
            if [[ ! -e "$path" ]]; then
              echo "Missing required path: $path"
              exit 1
            fi
          done

          echo "Repository structure validation passed."

      - name: Validate required documentation
        shell: bash
        run: |
          set -euo pipefail

          required_files=(
            "docs/adr/README.md"
            "docs/adr/0001-adr-template.md"
            "docs/development/git-workflow.md"
            "docs/development/engineering-baseline.md"
            "docs/governance/definition-of-ready-and-done.md"
            "docs/product/release-1/README.md"
            "docs/product/release-1/E01-baseline-audit.md"
            "docs/product/release-1/E01-environment-and-provider-matrix.md"
            "docs/adr/0025-modular-monolith-boundaries.md"
            "docs/adr/0026-transactional-outbox-and-background-execution.md"
            "docs/adr/0027-sibvo-authority-and-entitlement-snapshot.md"
            "docs/adr/0028-channel-gateway-architecture.md"
            "docs/adr/0029-ai-execution-and-disabled-by-default-policy.md"
            "docs/adr/0030-environment-and-configuration-standards.md"
          )

          for file in "${required_files[@]}"; do
            if [[ ! -f "$file" ]]; then
              echo "Missing required documentation file: $file"
              exit 1
            fi
          done

          echo "Documentation validation passed."

      - name: Validate the ADR register is up to date
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/rebuild_adr_index.py > /dev/null
          git diff --exit-code -- docs/adr/README.md
          echo "ADR register validation passed."

      - name: Check for obvious secret files
        shell: bash
        run: |
          set -euo pipefail

          forbidden_files=(
            ".env"
            ".env.local"
            ".env.production"
            ".env.development"
          )

          for file in "${forbidden_files[@]}"; do
            if [[ -f "$file" ]]; then
              echo "Forbidden secret/environment file detected: $file"
              exit 1
            fi
          done

          echo "Secret file baseline validation passed."

  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        # Pinned pgvector image (PostgreSQL 16). Digest pinned so a tag cannot change under CI.
        image: pgvector/pgvector:pg16@sha256:7b822b0aac60967beb1ea5e576b8602c94c300a157d187f385ae3e0da199b90a
        env:
          POSTGRES_DB: dealflow_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-postgres-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dealflow_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      APP_ENVIRONMENT: test
      DATABASE_URL: postgresql+psycopg://postgres:ci-only-postgres-password@localhost:5432/dealflow_test
      # This job runs on the pgvector image, so the pgvector guard test expects the extension.
      DEALFLOW_PGVECTOR_EXPECTED: present

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install backend dependencies from the lock file
        working-directory: backend
        run: uv sync --frozen

      - name: Generate a per-run outbox encryption key
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          key="$(uv run python -c 'import base64, os; print(base64.urlsafe_b64encode(os.urandom(32)).decode())')"
          echo "::add-mask::${key}"
          echo "EMAIL_OUTBOX_ENCRYPTION_KEY=${key}" >> "$GITHUB_ENV"

      - name: Install and verify the pgvector extension
        working-directory: backend
        run: uv run python -m scripts.verify_pgvector --expect present --create

      - name: Lint Release 1 foundation modules
        working-directory: backend
        run: >-
          uv run ruff check
          app/outbox
          app/db/models/outbox_event.py
          app/db/pgvector.py
          scripts/verify_pgvector.py
          tests/test_outbox.py
          tests/test_migrations_history.py
          tests/test_pgvector_support.py
          alembic/versions/e5a7c1d9b2f0_create_outbox_events.py

      - name: Run the backend test suite
        working-directory: backend
        run: uv run pytest -q

  backend-migrations:
    name: Migrations on an empty database
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        # Pinned pgvector image (PostgreSQL 16). Digest pinned so a tag cannot change under CI.
        image: pgvector/pgvector:pg16@sha256:7b822b0aac60967beb1ea5e576b8602c94c300a157d187f385ae3e0da199b90a
        env:
          POSTGRES_DB: dealflow_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-postgres-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dealflow_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      APP_ENVIRONMENT: test
      DATABASE_URL: postgresql+psycopg://postgres:ci-only-postgres-password@localhost:5432/dealflow_test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install backend dependencies from the lock file
        working-directory: backend
        run: uv sync --frozen

      - name: Install and verify the pgvector extension
        working-directory: backend
        run: uv run python -m scripts.verify_pgvector --expect present --create

      - name: Apply every migration to the empty database
        run: uv run --project backend alembic -c alembic.ini upgrade head

      - name: Assert exactly one Alembic head
        shell: bash
        run: |
          set -euo pipefail
          heads="$(uv run --project backend alembic -c alembic.ini heads)"
          count="$(printf '%s\n' "$heads" | grep -c '(head)' || true)"
          echo "$heads"
          if [[ "$count" != "1" ]]; then
            echo "Expected exactly one Alembic head, found ${count}."
            exit 1
          fi

  backend-pgvector-absent:
    # Proves two things on the official PostgreSQL image, which has no pgvector:
    # the existing migration chain does not depend on the extension, and the guard fails cleanly.
    name: Migrations and pgvector guard without pgvector
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        # Official PostgreSQL 16 image, digest pinned. It does not ship pgvector.
        image: postgres:16@sha256:1beaa3084eee2676f20a9cd9928f0bf2c5bf674f8e49f81017912183d377c61c
        env:
          POSTGRES_DB: dealflow_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-postgres-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dealflow_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      APP_ENVIRONMENT: test
      DATABASE_URL: postgresql+psycopg://postgres:ci-only-postgres-password@localhost:5432/dealflow_test
      DEALFLOW_PGVECTOR_EXPECTED: absent

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install backend dependencies from the lock file
        working-directory: backend
        run: uv sync --frozen

      - name: Assert pgvector is absent on this image
        working-directory: backend
        run: uv run python -m scripts.verify_pgvector --expect absent

      - name: Apply every migration without pgvector
        run: uv run --project backend alembic -c alembic.ini upgrade head

      - name: Assert exactly one Alembic head
        shell: bash
        run: |
          set -euo pipefail
          heads="$(uv run --project backend alembic -c alembic.ini heads)"
          count="$(printf '%s\n' "$heads" | grep -c '(head)' || true)"
          echo "$heads"
          if [[ "$count" != "1" ]]; then
            echo "Expected exactly one Alembic head, found ${count}."
            exit 1
          fi

      - name: Run the pgvector guard tests without the extension
        working-directory: backend
        run: uv run pytest tests/test_pgvector_support.py -q -p no:cacheprovider

  frontend-quality:
    name: Frontend quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies from the lock file
        working-directory: frontend
        run: npm ci

      - name: Type check
        working-directory: frontend
        run: npx tsc -b

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Unit tests
        working-directory: frontend
        run: npm test

      - name: Production build
        working-directory: frontend
        run: npm run build

  quality-gate:
    name: Quality gate
    runs-on: ubuntu-latest
    needs:
      - repository-validation
      - backend-tests
      - backend-migrations
      - backend-pgvector-absent
      - frontend-quality

    steps:
      - name: All required quality jobs succeeded
        run: echo "Repository validation, backend tests, migrations and frontend quality gates all succeeded."
